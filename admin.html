<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Konek WiFi — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-style.css" />
</head>
<body>

  <!-- Login screen -->
  <div class="login-wrap" id="login-wrap">
    <form class="login-card" id="login-form">
      <p class="wordmark">Konek<span>WiFi</span> <span class="admin-tag">Admin</span></p>
      <label class="field-label" for="username">Username</label>
      <input id="username" class="input" type="text" autocomplete="username" required />
      <label class="field-label" for="password">Password</label>
      <input id="password" class="input" type="password" autocomplete="current-password" required />
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard" style="display:none;">
    <header class="dash-header">
      <p class="wordmark">Konek<span>WiFi</span> <span class="admin-tag">Admin</span></p>
      <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
    </header>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="sales">Sales</button>
      <button type="button" class="tab" data-tab="rates">Rates</button>
      <button type="button" class="tab" data-tab="vouchers">Vouchers</button>
    </nav>

    <section id="tab-sales" class="tab-panel active">
      <div class="summary-card">
        <p class="summary-label">Total collected (all time)</p>
        <p class="summary-value" id="total-collected">₱0.00</p>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th><th>Device</th></tr>
        </thead>
        <tbody id="sales-body"></tbody>
      </table>
    </section>

    <section id="tab-rates" class="tab-panel">
      <table class="data-table" id="rates-table">
        <thead>
          <tr><th>Plan name</th><th>Price (₱)</th><th>Duration (hours)</th><th>Order</th><th></th></tr>
        </thead>
        <tbody id="rates-body"></tbody>
      </table>
      <button type="button" class="btn btn-ghost" id="add-rate-btn">+ Add plan</button>
    </section>

    <section id="tab-vouchers" class="tab-panel">
      <div class="voucher-generate-row">
        <select id="voucher-plan-select" class="input" style="max-width:220px;"></select>
        <input id="voucher-count" class="input" type="number" min="1" max="500" value="10" style="max-width:100px;" />
        <button type="button" class="btn btn-primary" id="generate-vouchers-btn">Generate</button>
      </div>
      <div id="generated-result" class="generated-result" style="display:none;">
        <p class="generated-label">Newly generated codes (copy these to print):</p>
        <textarea id="generated-codes" class="codes-box" readonly rows="6"></textarea>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>Code</th><th>Plan</th><th>Status</th><th>Created</th><th>Used</th><th></th></tr>
        </thead>
        <tbody id="vouchers-body"></tbody>
      </table>
    </section>
  </div>

  <script>window.BACKEND_URL = "https://wifigcash.onrender.com";</script>
  <script src="admin-script.js"></script>
</body>
</html>
